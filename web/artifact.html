<title>KT89S51 實驗板模擬器</title>
<link rel="stylesheet" href="style.css">
<noscript><div style="padding:16px;background:#1a0505;color:#FF4A3D;font:14px monospace">這個模擬器需要 JavaScript，請在瀏覽器設定裡開啟。</div></noscript>
<div id="app">
  <header id="toolbar">
    <div class="brand"><b>KT89S51</b><i>V4.2 + KDM+</i></div>
    <div class="group">
      <button id="btn-new" title="開一個空白的組合語言檔">新檔案</button>
      <button id="btn-open" title="從電腦開啟檔案（也可以直接把檔案拖進視窗）">開啟</button>
      <input type="text" id="file-name" value="未命名" size="12" title="檔名（下載時會用這個名字）">
      <button id="btn-export" title="下載成純文字 .txt 檔">下載</button>
      <input type="file" id="file-input" accept=".txt,.asm,.a51,.s,.kt89,.hex,.ihx" hidden>
      <select id="sel-example" title="課本範例"><option value="">選擇範例…</option></select>
    </div>
    <div class="group">
      <button id="btn-run" class="primary" title="執行 / 暫停 (F5)">▶ 執行</button>
      <label class="chk"><input type="checkbox" id="chk-audio" checked> 蜂鳴器音效</label>
      <span class="zoom"><button id="btn-zoom-out" title="板子縮小">−</button><button id="btn-zoom-fit" title="板子縮放回適合寬度">⊡</button><button id="btn-zoom-in" title="板子放大（手機上點針腳用）">＋</button></span>
    </div>
    <div class="status">
      <span id="st-name">尚未載入程式</span>
      <span id="st-pc">PC 0000</span>
      <span id="st-r0">R0 00</span>
      <span id="st-cycles">0 µs</span>
      <span id="st-reason"></span>
      <span id="st-build"></span>
    </div>
  </header>

  <main id="main">
    <!-- 左邊：硬體，底下停靠各種監視面板 -->
    <section id="left">
      <div id="board-wrap"></div>
      <div id="warnings" class="card warn" hidden></div>
      <div id="dock">
        <nav id="tabs">
          <button data-tab="regs" class="active">暫存器</button>
          <button data-tab="disasm">反組譯</button>
          <button data-tab="wave">波形</button>
          <button data-tab="wiring">接線</button>
          <button data-tab="analog">類比</button>
          <button data-tab="periph">週邊</button>
          <button data-tab="output">輸出</button>
          <button data-tab="memory">記憶體</button>
        </nav>
        <div id="tab-regs" class="tab active"><div id="regs"></div></div>
        <div id="tab-disasm" class="tab"><div id="disasm"></div></div>
        <div id="tab-wave" class="tab"><div id="wave"></div></div>
        <div id="tab-wiring" class="tab"><div id="wiring"></div></div>
        <div id="tab-analog" class="tab"><div id="analog-panel">
          <label>VR1 可變電阻 (ADC CH0) <input type="range" id="rng-pot" min="0" max="5" step="0.01" value="2.5"> <span id="val-pot">2.50 V</span></label>
          <label>環境溫度 (LM35 / TC74) <input type="range" id="rng-temp" min="-10" max="80" step="0.5" value="25"> <span id="val-temp">25.0 °C</span></label>
          <div class="dac">DAC 輸出 A <div class="bar"><div id="dac-a"></div></div> <span id="val-dac-a">0.000 V</span></div>
          <div class="dac">DAC 輸出 B <div class="bar"><div id="dac-b"></div></div> <span id="val-dac-b">0.000 V</span></div>
        </div></div>
        <div id="tab-periph" class="tab"><div id="periph"></div></div>
        <div id="tab-output" class="tab"><div id="output"></div></div>
        <div id="tab-memory" class="tab"><div id="memory"></div></div>
      </div>
    </section>

    <!-- 右邊：永遠是原始碼 -->
    <section id="right">
      <div id="src-bar">
        <span class="title">原始碼</span>
        <button id="btn-copy" title="把編輯器裡的原始碼整份複製到剪貼簿">複製到剪貼簿</button>
      </div>
      <div id="src-box"><div id="source"></div></div>
    </section>
  </main>
  <div id="drop-hint" hidden>放開以載入檔案</div>
</div>
<script type="module" src="src/ui/app.js"></script>
