<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KT89S51 實驗板模擬器</title>
</head>
<body>
<title>KT89S51 實驗板模擬器</title>
<style>
/* 綠色終端機：黑底、磷光綠、方角、不用粗體 —— 輕重一律靠亮度。
   字型只用系統等寬字，不掛任何 webfont，免得離線版（單檔 file://）抓不到。 */
[hidden] { display: none !important; }

:root {
  --bg: #000000;          /* 終端機底 */
  --panel: #030B05;       /* 面板 */
  --well: #010603;        /* 凹槽、讀數窗、程式碼底 */
  --line: #06491E;        /* 面板框線 */
  --line2: #0A6B2B;       /* 亮框線、切口 */
  --grid: #073A18;        /* 格線、停用 */
  --text: #16C04F;        /* 一般文字 */
  --muted: #0E9C3E;       /* 刻印小標、註解 */
  --faint: #0A6B2B;       /* 最暗的字 */
  --accent: #00FF41;      /* 主要文字、讀數、可互動 */
  --ok: #00FF41;
  --warn: #FFB000;        /* 變動、提醒 */
  --err: #FF4A3D;         /* 錯誤、中斷點 */
  --glow: 0 0 8px rgba(0, 255, 65, .4);
  --mono: "Cascadia Mono", "Consolas", "DejaVu Sans Mono", "Menlo", "Noto Sans Mono",
          "Microsoft JhengHei", "PingFang TC", monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.45 var(--mono); color-scheme: dark;
  -webkit-font-smoothing: antialiased;
}
/* 映像管玻璃：掃描線 + 一點點暈影，蓋在所有東西上面 */
body::after {
  content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,.07) 0 1px, rgba(0,0,0,0) 1px 3px),
    radial-gradient(ellipse 88% 84% at 50% 46%, rgba(0,0,0,0) 62%, rgba(0,0,0,.18) 100%);
}
#app { display: flex; flex-direction: column; height: 100%; }

button {
  background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 0;
  padding: 5px 10px; cursor: pointer; font: inherit; font-weight: normal; letter-spacing: .04em;
}
button:hover { border-color: var(--line2); color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #000; box-shadow: 0 0 16px rgba(0,255,65,.4); }
button.primary:hover { color: #000; }
button.primary.running { background: var(--warn); border-color: var(--warn); box-shadow: 0 0 16px rgba(255,176,0,.4); }
button:disabled { color: var(--faint); border-color: var(--grid); box-shadow: none; cursor: default; }
select, input[type=text] {
  background: var(--well); color: var(--accent); border: 1px solid var(--line); border-radius: 0;
  padding: 4px 7px; font: inherit;
}
select:focus, input[type=text]:focus { outline: none; border-color: var(--accent); }
label.chk { display: inline-flex; align-items: center; gap: 5px; color: var(--text); }
input[type=checkbox], input[type=range] { accent-color: var(--accent); }

/* ---------- 控制列 ---------- */
#toolbar {
  display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
  padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
}
#toolbar .group { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
#toolbar .brand { display: flex; flex-direction: column; line-height: 1.1; padding-right: 12px; border-right: 1px solid var(--line); }
#toolbar .brand b { font-weight: normal; font-size: 15px; letter-spacing: .1em; color: var(--accent); text-shadow: 0 0 9px rgba(0,255,65,.5); }
#toolbar .brand i { font-style: normal; font-size: 9.5px; letter-spacing: .2em; color: var(--muted); }
#toolbar .status {
  margin-left: auto; display: flex; align-items: stretch; gap: 0;
  background: var(--well); border: 1px solid var(--line); color: var(--muted);
}
#toolbar .status > span { padding: 3px 12px; border-right: 1px solid var(--line); display: flex; align-items: center; }
#toolbar .status > span:last-child { border-right: 0; }
#toolbar .status #st-name { color: var(--text); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#toolbar .status #st-pc, #toolbar .status #st-cycles, #toolbar .status #st-r0 {
  color: var(--accent); text-shadow: var(--glow); letter-spacing: .04em;
}
#toolbar .status #st-reason { color: var(--warn); }
#toolbar .status #st-build { color: var(--faint); font-size: 11px; }
#toolbar .status > span:empty { display: none; }
#toolbar .zoom { display: inline-flex; gap: 0; }
#toolbar .zoom button { padding: 5px 9px; border-right-width: 0; }
#toolbar .zoom button:last-child { border-right-width: 1px; }

/* ---------- 版面 ---------- */
#main { flex: 1; display: grid; grid-template-columns: minmax(560px, 1.32fr) minmax(430px, 1fr); gap: 12px; padding: 12px; min-height: 0; }
#left { display: flex; flex-direction: column; gap: 14px; overflow: auto; min-height: 0; }
#left > * { flex: none; }   /* 板子不准被擠扁，左欄放不下就讓它捲 */
#right { display: flex; flex-direction: column; gap: 0; min-height: 0; }

/* 面板：方角、細框，標題嵌在框線上的切口裡 */
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 0; padding: 15px 13px 12px; }
.card h3 {
  position: absolute; top: -8px; left: 10px; margin: 0; padding: 0 6px; background: var(--bg);
  font-size: 10.5px; font-weight: normal; letter-spacing: .2em; color: var(--muted); text-transform: none;
}
.card h3::before { content: '[ '; } .card h3::after { content: ' ]'; }
.card.warn { border-color: var(--warn); color: var(--warn); font-size: 12px; }
.card.warn div { padding: 2px 0; }
.card.warn .suggest { color: var(--accent); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card.warn .suggest button { padding: 2px 8px; border-color: var(--line2); }

/* ---------- 板子 ---------- */
#board-wrap { position: relative; overflow-x: auto; overflow-y: hidden; background: var(--well); border: 1px solid var(--line); padding: 8px; -webkit-overflow-scrolling: touch; }
#board-wrap svg { width: calc(100% * var(--bz, 1)); height: auto; display: block; }
.board-tip {
  position: absolute; z-index: 20; max-width: 300px; background: rgba(0,0,0,.94); color: var(--text);
  border: 1px solid var(--accent); border-radius: 0; padding: 7px 10px; font-size: 11.5px; line-height: 1.5;
  pointer-events: none; box-shadow: 0 0 18px rgba(0,0,0,.9);
}
.board-tip b { color: var(--accent); font-weight: normal; }
#board-wrap .clickable { cursor: pointer; }
#board-wrap text { user-select: none; pointer-events: none; }

/* ---------- 類比 / 環境 ---------- */
#analog-panel label { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--text); }
#analog-panel input[type=range] { flex: 1; }
#analog-panel span { min-width: 74px; text-align: right; color: var(--accent); }
#analog-panel .dac { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--muted); }
#analog-panel .bar { flex: 1; height: 9px; background: var(--well); border: 1px solid var(--grid); }
#analog-panel .bar div { height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 8px rgba(0,255,65,.5); }

/* ---------- 暫存器（收在分頁裡）---------- */
#regs { padding: 10px; display: flex; flex-direction: column; gap: 9px; font-size: 12px; }
#regs .rg-grid { display: grid; gap: 4px; }
#regs .rg-core { grid-template-columns: repeat(auto-fit, minmax(86px, 1fr)); }
#regs .rg-bank { grid-template-columns: repeat(8, minmax(0, 1fr)); }
#regs .rg-sfr { grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); }
#regs .rg { background: var(--well); border: 1px solid var(--grid); padding: 4px 7px; display: flex; flex-direction: column; }
#regs .rg b { font-weight: normal; font-size: 9.5px; letter-spacing: .14em; color: var(--muted); }
#regs .rg span { font-size: 13.5px; color: var(--text); }
#regs .rg.hot span { color: var(--accent); text-shadow: var(--glow); }
#regs .rg.changed { border-color: var(--warn); }
#regs .rg.changed span { color: var(--warn); }
#regs .rg-sfr .rg { flex-direction: row; align-items: baseline; justify-content: space-between; gap: 6px; }
#regs .rg-sfr .rg span { font-size: 12.5px; }

#regs .rg-flags { display: flex; align-items: center; gap: 4px; }
#regs .rg-flags b { font-weight: normal; width: 32px; flex: none; font-size: 9.5px; letter-spacing: .16em; color: var(--muted); }
#regs .rg-flags i { flex: 1; font-style: normal; text-align: center; padding: 2px 0; font-size: 10.5px; border: 1px solid var(--grid); color: var(--faint); }
#regs .rg-flags i.on { background: var(--accent); border-color: var(--accent); color: #000; }
#regs .rg-flags em { font-style: normal; flex: none; padding-left: 8px; font-size: 10.5px; color: var(--muted); }

#regs .rg-port { display: flex; align-items: center; gap: 7px; }
#regs .rg-port b { font-weight: normal; width: 22px; flex: none; color: var(--muted); }
#regs .rg-port .bits { flex: none; display: flex; gap: 2px; }
#regs .rg-port .bits i {
  font-style: normal; width: 19px; height: 20px; display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; background: var(--well); color: var(--text); box-shadow: inset 0 0 0 1px var(--grid);
}
#regs .rg-port .bits i.lo { background: var(--text); color: #000; }          /* 0 = 反白 */
#regs .rg-port .bits i.diff { box-shadow: inset 0 0 0 1px var(--grid), inset 0 -3px 0 var(--warn); }
#regs .rg-port .hex { flex: none; color: var(--text); }
#regs .rg-port .hex u { text-decoration: none; }
#regs .rg-port .hex.split u { color: var(--warn); }
#regs .rg-port .hex em { font-style: normal; color: var(--faint); }
#regs .rg-port .note { flex: 1; text-align: right; font-size: 10.5px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#regs .rg-legend { font-size: 10.5px; color: var(--muted); }
#regs .rg-legend em { font-style: normal; color: var(--warn); }

/* ---------- 分頁 ---------- */
#tabs { display: flex; gap: 0; border: 1px solid var(--line); border-bottom: 0; background: var(--panel); }
#tabs button { border: 0; border-right: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--muted); padding: 8px 11px; }
#tabs button:hover { color: var(--accent); }
#tabs button.active { background: var(--line); color: var(--accent); }
.tab { display: none; flex: 1; min-height: 0; overflow: auto; background: var(--well); border: 1px solid var(--line); }
.tab.active { display: block; }

/* ---------- 原始碼 / 反組譯 ---------- */
#source, #disasm { font-size: 12.5px; }
.line { display: flex; white-space: pre; min-height: 19px; }
.line .gutter { width: 50px; flex: none; text-align: right; padding-right: 9px; color: var(--faint); cursor: pointer; user-select: none; position: relative; }
.line .gutter:hover { color: var(--accent); }
.line.bp .gutter::before { content: '●'; color: var(--err); position: absolute; left: 6px; }
.line.cur { background: rgba(0, 255, 65, .07); }
.line.cur .gutter { color: var(--accent); }
.line.cur .gutter::after { content: '▶'; color: var(--accent); position: absolute; left: 20px; }
.line.err { background: rgba(255, 74, 61, .14); }
.line.warnl { background: rgba(255, 176, 0, .13); }
.line.nocode .gutter { color: #2A3A2C; }
.line .txt { flex: 1; padding-left: 6px; }
.line .addr { width: 52px; color: var(--muted); flex: none; }
.line .bytes { width: 82px; color: var(--faint); flex: none; }
.line .cline { color: var(--muted); flex: none; width: 40px; text-align: right; padding-right: 8px; }

/* 語法配色：六個角色六個色相，亮度與彩度算在同一階上 */
.tok-lbl { color: #77DF89; }   /* 標籤 */
.tok-kw  { color: #7DC4FF; }   /* 助憶碼 */
.tok-pp  { color: #FF8785; }   /* 偽指令 ORG EQU END */
.tok-reg { color: #FFAE5D; }   /* 暫存器、位元位址 */
.tok-num { color: #D7A6FC; }   /* 立即值 */
.tok-str { color: #80DBEB; }
.tok-cm  { color: #839085; }   /* 註解 */

/* ---------- 記憶體 ---------- */
#memory { font-size: 12px; padding: 8px; }
#memory h4 { margin: 10px 0 5px; color: var(--muted); font-weight: normal; font-size: 10.5px; letter-spacing: .16em; }
#memory h4:first-child { margin-top: 0; }
#memory .hexrow { white-space: pre; color: var(--text); }
#memory .hexrow .a { color: var(--muted); }
#memory .b { color: var(--text); }
#memory .b.ch { color: var(--warn); }
#memory .b.pc { background: var(--text); color: #000; }
#memory .sym { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 10px; }
#memory .sym b, #memory .sfrgrid b { font-weight: normal; }
#memory .sfrgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 2px 8px; }

/* ---------- 波形 ---------- */
#wave { padding: 8px; height: 100%; display: flex; flex-direction: column; gap: 7px; }
#wave .ctl { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); }
#wave .ctl .pins { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 11px; }
#wave canvas { width: 100%; flex: 1; background: #000; border: 1px solid var(--grid); }

/* ---------- 週邊監視 ---------- */
#periph { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
#periph .box { background: var(--well); border: 1px solid var(--grid); padding: 7px 9px; font-size: 11.5px; min-height: 60px; }
#periph .box h4 { margin: 0 0 5px; color: var(--muted); font: 10px var(--mono); font-weight: normal; letter-spacing: .16em; }
#periph .box pre { margin: 0; white-space: pre-wrap; max-height: 220px; overflow: auto; color: var(--text); font: inherit; }

/* ---------- 接線 ---------- */
#wiring { padding: 9px; }
#wiring .conn { display: grid; grid-template-columns: 250px 1fr; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--grid); color: var(--muted); }
#wiring .conn .pins { display: flex; flex-wrap: wrap; gap: 3px; }
#wiring .conn select { font-size: 11px; padding: 1px 3px; }
#wiring .grp { margin-top: 11px; display: flex; align-items: center; gap: 10px; color: var(--accent); }
#wiring .grp label { color: var(--text); }
#wiring .quick { display: flex; gap: 0; margin-left: 6px; }
#wiring .quick button { padding: 1px 7px; font-size: 11px; border-right-width: 0; }
#wiring .quick button:last-child { border-right-width: 1px; }
#wiring .conf { margin: 10px 0; }
#wiring .conf div.error { color: var(--err); } #wiring .conf div.warn { color: var(--warn); }
#wiring .presets, #wiring .wtools { display: flex; gap: 6px; align-items: center; margin-bottom: 9px; flex-wrap: wrap; color: var(--muted); }
#wiring .wlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 10px; font-size: 11px; color: var(--text); }
#wiring .wlist .none { color: var(--faint); }

/* ---------- 輸出 ---------- */
#output { padding: 9px; font-size: 12px; color: var(--text); }
#output .diag { cursor: pointer; padding: 2px 4px; }
#output .diag.error { color: var(--err); } #output .diag.warning { color: var(--warn); }
#output .diag:hover { background: var(--line); }
#output h4 { margin: 10px 0 5px; color: var(--muted); font-weight: normal; font-size: 10.5px; letter-spacing: .16em; }
#output pre { background: #000; border: 1px solid var(--grid); padding: 7px; white-space: pre-wrap; max-height: 260px; overflow: auto; margin: 0; font: inherit; color: var(--text); }

#drop-hint { position: fixed; inset: 0; background: rgba(0,255,65,.08); border: 2px dashed var(--accent); display: flex; align-items: center; justify-content: center; font-size: 26px; letter-spacing: .1em; color: var(--accent); text-shadow: var(--glow); z-index: 99; pointer-events: none; }
kbd { background: var(--well); border: 1px solid var(--line2); border-bottom-width: 2px; padding: 0 5px; font: inherit; font-size: 11px; color: var(--accent); }

@media (max-width: 1250px) { #main { grid-template-columns: 1fr; } }

/* ---------- 手機 / 直式平板 ---------- */
@media (max-width: 900px) {
  html, body { height: auto; }
  #app { height: auto; min-height: 100%; }
  #main { display: block; padding: 8px; }
  #left, #right { overflow: visible; min-height: 0; }
  #right { margin-top: 14px; }
  .tab { max-height: 65vh; }

  #toolbar { gap: 5px 10px; padding: 7px; font-size: 12px; }
  #toolbar button { padding: 7px 9px; }
  #toolbar select { padding: 6px 6px; }
  #toolbar .status { margin-left: 0; width: 100%; font-size: 11px; flex-wrap: wrap; }
  #toolbar .status > span { padding: 3px 9px; }
  #toolbar .status #st-name { max-width: none; }

  /* 手機上不讓工具列把整個 #app 撐寬（撐寬了下面每一塊都會跟著超出畫面）*/
  body { overflow-x: hidden; }
  #app, #toolbar, #main { max-width: 100%; }
  #toolbar .group { min-width: 0; max-width: 100%; }
  #toolbar select { max-width: 44vw; }
  #file-name { width: 30vw; min-width: 88px; }
  #periph .box pre { word-break: break-all; }
  #analog-panel label > span, #analog-panel .dac > span { min-width: 60px; }

  #tabs { overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button { flex: none; white-space: nowrap; padding: 8px 11px; }

  .board-tip { max-width: 70vw; }
  /* 滑桿自己占一行，數值才不會被擠到畫面外 */
  #analog-panel label, #analog-panel .dac { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; }
  #analog-panel label input[type=range], #analog-panel .dac .bar { grid-column: 1 / -1; }
  #regs .rg-port .note { display: none; }
}

/* ---------- 可編輯的原始碼 ---------- */
.editor { display: flex; align-items: flex-start; font-size: 12.5px; line-height: 19px; min-height: 100%; background: #040805; }
.editor .gut {
  position: sticky; left: 0; z-index: 3; flex: none; width: 50px; padding-right: 9px; text-align: right;
  background: var(--panel); color: #727E74; user-select: none; border-right: 1px solid var(--grid);
}
.editor .gut div { height: 19px; cursor: pointer; position: relative; }
.editor .gut div:hover { color: var(--accent); }
.editor .gut div.nocode { color: #3A4A3C; }
.editor .gut div.bp::before { content: '●'; color: var(--err); position: absolute; left: 5px; }
.editor .gut div.cur { color: var(--accent); }
.editor .gut div.cur::after { content: '▶'; color: var(--accent); position: absolute; left: 19px; }
.editor .codecol { position: relative; flex: 1; min-width: max-content; }
.editor .marks { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.editor .marks div { position: absolute; left: 0; right: 0; height: 19px; min-width: 100%; }
.editor .marks .m-cur { background: rgba(0, 255, 65, .07); }
.editor .marks .m-err { background: rgba(255, 74, 61, .14); }
.editor .marks .m-warn { background: rgba(255, 176, 0, .13); }
.editor pre.hl, .editor textarea {
  margin: 0; padding: 0 12px 0 8px; border: 0; font: inherit; line-height: inherit;
  white-space: pre; tab-size: 8; -moz-tab-size: 8;
}
.editor pre.hl { position: relative; z-index: 1; pointer-events: none; color: var(--text); }
.editor textarea {
  position: absolute; inset: 0; z-index: 2; width: 100%; background: transparent; color: transparent;
  caret-color: var(--accent); resize: none; outline: none; overflow: hidden;
}
.editor textarea::selection { background: rgba(0, 255, 65, .22); }
#source.ro .editor textarea { caret-color: transparent; }

/* 編輯器底下的語法色例 */
#legend { flex: none; display: flex; align-items: center; gap: 13px; flex-wrap: wrap; padding: 5px 10px; background: var(--panel); border: 1px solid var(--line); border-top: 0; font-size: 10.5px; color: var(--muted); }
#legend span { display: inline-flex; align-items: center; gap: 5px; }
#legend i { font-style: normal; width: 8px; height: 8px; }

#fatal { background: rgba(255,74,61,.14); color: var(--err); border-bottom: 1px solid var(--err); padding: 9px 11px; font-size: 12px; white-space: pre-wrap; }

/* ---------- 磷光輝光：只給需要強調的字，不是整片都發亮 ---------- */
/* 三階：主要讀數最亮、可互動次之、警告與錯誤各自的色相 */
:root {
  --glow-strong: 0 0 4px rgba(0,255,65,.85), 0 0 12px rgba(0,255,65,.45), 0 0 26px rgba(0,255,65,.18);
  --glow-soft:   0 0 3px rgba(0,255,65,.55), 0 0 10px rgba(0,255,65,.22);
  --glow-warn:   0 0 4px rgba(255,176,0,.8), 0 0 13px rgba(255,176,0,.35);
  --glow-err:    0 0 4px rgba(255,74,61,.8), 0 0 13px rgba(255,74,61,.35);
}

/* 狀態列讀數：PC / 週期 / R0 —— 執行時一直在跳，是最該亮的東西 */
#toolbar .status b,
#toolbar .status #st-pc,
#toolbar .status #st-cycles,
#toolbar .status #st-r0 { color: var(--accent); text-shadow: var(--glow-strong); }
#toolbar .status #st-reason { color: var(--warn); text-shadow: var(--glow-warn); }

/* 機型銘牌 */

    if (addr < 0x80) { this.iram[addr] = val; return; }
    const p = PORT_ADDR[addr];
    if (p !== undefined) { this.sfr[addr - 0x80] = val; this.bus.write(p, val); return; }
    if (addr === SFR.SBUF) { this.uartTransmit(val); return; }
    this.sfr[addr - 0x80] = val;
    if (this.onSfrWrite) this.onSfrWrite(addr, val);
  }

  readBit(bit) {
    const byte = bitAddrToByte(bit), mask = bitAddrToMask(bit);
    return (this.readDirect(byte, false) & mask) ? 1 : 0;
  }
  writeBit(bit, v) {
    const byte = bitAddrToByte(bit), mask = bitAddrToMask(bit);
    const cur = this.readDirect(byte, true);
    this.writeDirect(byte, v ? (cur | mask) : (cur & ~mask));
  }

  push(v) { this.sp = this.sp + 1; this.iram[this.sp] = v & 0xFF; }
  pop() { const v = this.iram[this.sp]; this.sp = this.sp - 1; return v; }

  fetch() { return this.code[this.pc++ & 0xFFFF]; }

  // ---------- 旗標運算 ----------
  add(a, b, c) {
    const r = a + b + c;
    const ac = ((a & 0x0F) + (b & 0x0F) + c) > 0x0F;
    const cy = r > 0xFF;
    const r7 = ((a & 0x7F) + (b & 0x7F) + c) > 0x7F;
    const ov = (cy !== r7);
    let psw = this.psw & ~(PSW_CY | PSW_AC | PSW_OV);
    if (cy) psw |= PSW_CY;
    if (ac) psw |= PSW_AC;
    if (ov) psw |= PSW_OV;
    this.psw = psw;
    return r & 0xFF;
  }
  sub(a, b, c) {
    const r = a - b - c;
    const cy = r < 0;
    const ac = ((a & 0x0F) - (b & 0x0F) - c) < 0;
    const r7 = ((a & 0x7F) - (b & 0x7F) - c) < 0;
    const ov = (cy !== r7);
    let psw = this.psw & ~(PSW_CY | PSW_AC | PSW_OV);
    if (cy) psw |= PSW_CY;
    if (ac) psw |= PSW_AC;
    if (ov) psw |= PSW_OV;
    this.psw = psw;
    return r & 0xFF;
  }
  get cy() { return (this.psw & PSW_CY) ? 1 : 0; }
  set cy(v) { this.psw = v ? (this.psw | PSW_CY) : (this.psw & ~PSW_CY); }

  // ---------- 執行 ----------
  // 執行一條指令，回傳消耗的機械週期
  step() {
    if (this.trace) this.trace(this.pc);
    const pcStart = this.pc;
    const op = this.fetch();
    let cyc = 1;
    const hi = op >> 4, lo = op & 0x0F;

    // 規則區（lo >= 4）：算術/邏輯/搬移類
    // 運算元取得
    const operandRead = (rmw) => {
      // 回傳 [value, writeback(v)]
      if (lo === 5) { const a = this.fetch(); return [this.readDirect(a, rmw), (v) => this.writeDirect(a, v), a]; }
      if (lo === 6 || lo === 7) { const a = this.getR(lo - 6); return [this.iram[a], (v) => { this.iram[a] = v & 0xFF; }, a]; }
      if (lo >= 8) { const n = lo - 8; return [this.getR(n), (v) => this.setR(n, v), n]; }
      return null;
    };

    switch (op) {
      case 0x00: break; // NOP
      case 0x01: case 0x21: case 0x41: case 0x61: case 0x81: case 0xA1: case 0xC1: case 0xE1: { // AJMP
        const a = this.fetch();
        this.pc = (this.pc & 0xF800) | ((op & 0xE0) << 3) | a; cyc = 2; break;
      }
      case 0x11: case 0x31: case 0x51: case 0x71: case 0x91: case 0xB1: case 0xD1: case 0xF1: { // ACALL
        const a = this.fetch();
        this.push(this.pc & 0xFF); this.push(this.pc >> 8);
        this.pc = (this.pc & 0xF800) | ((op & 0xE0) << 3) | a; cyc = 2; break;
      }
      case 0x02: { const h = this.fetch(), l = this.fetch(); this.pc = (h << 8) | l; cyc = 2; break; } // LJMP
      case 0x12: { const h = this.fetch(), l = this.fetch(); this.push(this.pc & 0xFF); this.push(this.pc >> 8); this.pc = (h << 8) | l; cyc = 2; break; } // LCALL
      case 0x22: { const h = this.pop(), l = this.pop(); this.pc = (h << 8) | l; cyc = 2; break; } // RET
      case 0x32: { const h = this.pop(), l = this.pop(); this.pc = (h << 8) | l; cyc = 2; this.retiFromInterrupt(); break; } // RETI
      case 0x03: this.acc = ((this.acc >> 1) | (this.acc << 7)) & 0xFF; break; // RR A
      case 0x13: { const c = this.cy; this.cy = this.acc & 1; this.acc = (this.acc >> 1) | (c << 7); break; } // RRC A
      case 0x23: this.acc = ((this.acc << 1) | (this.acc >> 7)) & 0xFF; break; // RL A
      case 0x33: { const c = this.cy; this.cy = this.acc >> 7; this.acc = ((this.acc << 1) | c) & 0xFF; break; } // RLC A
      case 0x04: this.acc = this.acc + 1; break; // INC A
      case 0x14: this.acc = this.acc - 1; break; // DEC A
      case 0x05: case 0x06: case 0x07: case 0x08: case 0x09: case 0x0A: case 0x0B: case 0x0C: case 0x0D: case 0x0E: case 0x0F: { // INC
        const [v, wb] = operandRead(true); wb(v + 1); break;
      }
      case 0x15: case 0x16: case 0x17: case 0x18: case 0x19: case 0x1A: case 0x1B: case 0x1C: case 0x1D: case 0x1E: case 0x1F: { // DEC
        const [v, wb] = operandRead(true); wb(v - 1); break;
      }
      case 0x10: { // JBC bit,rel
        const bit = this.fetch(), rel = (this.fetch() << 24) >> 24; cyc = 2;
        const byte = bitAddrToByte(bit), mask = bitAddrToMask(bit);
        const cur = this.readDirect(byte, true);
        if (cur & mask) { this.writeDirect(byte, cur & ~mask); this.pc = (this.pc + rel) & 0xFFFF; }
        break;
      }
      case 0x20: { const bit = this.fetch(), rel = (this.fetch() << 24) >> 24; cyc = 2; if (this.readBit(bit)) this.pc = (this.pc + rel) & 0xFFFF; break; } // JB
      case 0x30: { const bit = this.fetch(), rel = (this.fetch() << 24) >> 24; cyc = 2; if (!this.readBit(bit)) this.pc = (this.pc + rel) & 0xFFFF; break; } // JNB
      case 0x40: { const rel = (this.fetch() << 24) >> 24; cyc = 2; if (this.cy) this.pc = (this.pc + rel) & 0xFFFF; break; } // JC
      case 0x50: { const rel = (this.fetch() << 24) >> 24; cyc = 2; if (!this.cy) this.pc = (this.pc + rel) & 0xFFFF; break; } // JNC
      case 0x60: { const rel = (this.fetch() << 24) >> 24; cyc = 2; if (this.acc === 0) this.pc = (this.pc + rel) & 0xFFFF; break; } // JZ
      case 0x70: { const rel = (this.fetch() << 24) >> 24; cyc = 2; if (this.acc !== 0) this.pc = (this.pc + rel) & 0xFFFF; break; } // JNZ
      case 0x80: { const rel = (this.fetch() << 24) >> 24; cyc = 2; this.pc = (this.pc + rel) & 0xFFFF; break; } // SJMP
      case 0x24: { this.acc = this.add(this.acc, this.fetch(), 0); break; } // ADD A,#imm
      case 0x25: case 0x26: case 0x27: case 0x28: case 0x29: case 0x2A: case 0x2B: case 0x2C: case 0x2D: case 0x2E: case 0x2F: {
        const [v] = operandRead(false); this.acc = this.add(this.acc, v, 0); break;
      }
      case 0x34: { this.acc = this.add(this.acc, this.fetch(), this.cy); break; } // ADDC
      case 0x35: case 0x36: case 0x37: case 0x38: case 0x39: case 0x3A: case 0x3B: case 0x3C: case 0x3D: case 0x3E: case 0x3F: {
        const [v] = operandRead(false); this.acc = this.add(this.acc, v, this.cy); break;
      }
      case 0x42: { const a = this.fetch(); this.writeDirect(a, this.readDirect(a, true) | this.acc); break; } // ORL direct,A
      case 0x43: { const a = this.fetch(), i = this.fetch(); cyc = 2; this.writeDirect(a, this.readDirect(a, true) | i); break; } // ORL direct,#imm
      case 0x44: { this.acc |= this.fetch(); break; }
      case 0x45: case 0x46: case 0x47: case 0x48: case 0x49: case 0x4A: case 0x4B: case 0x4C: case 0x4D: case 0x4E: case 0x4F: {
        const [v] = operandRead(false); this.acc |= v; break;
      }
      case 0x52: { const a = this.fetch(); this.writeDirect(a, this.readDirect(a, true) & this.acc); break; } // ANL direct,A
      case 0x53: { const a = this.fetch(), i = this.fetch(); cyc = 2; this.writeDirect(a, this.readDirect(a, true) & i); break; }
      case 0x54: { this.acc &= this.fetch(); break; }
      case 0x55: case 0x56: case 0x57: case 0x58: case 0x59: case 0x5A: case 0x5B: case 0x5C: case 0x5D: case 0x5E: case 0x5F: {
        const [v] = operandRead(false); this.acc &= v; break;
      }
      case 0x62: { const a = this.fetch(); this.writeDirect(a, this.readDirect(a, true) ^ this.acc); break; } // XRL direct,A
      case 0x63: { const a = this.fetch(), i = this.fetch(); cyc = 2; this.writeDirect(a, this.readDirect(a, true) ^ i); break; }
      case 0x64: { this.acc ^= this.fetch(); break; }
      case 0x65: case 0x66: case 0x67: case 0x68: case 0x69: case 0x6A: case 0x6B: case 0x6C: case 0x6D: case 0x6E: case 0x6F: {
        const [v] = operandRead(false); this.acc ^= v; break;
      }
      case 0x72: { const bit = this.fetch(); cyc = 2; this.cy = this.cy | this.readBit(bit); break; } // ORL C,bit
      case 0x73: { this.pc = (this.acc + this.dptr) & 0xFFFF; cyc = 2; break; } // JMP @A+DPTR
      case 0x74: { this.acc = this.fetch(); break; } // MOV A,#imm
      case 0x75: { const a = this.fetch(), i = this.fetch(); cyc = 2; this.writeDirect(a, i); break; } // MOV direct,#imm
      case 0x76: case 0x77: { const i = this.fetch(); this.iram[this.getR(op - 0x76)] = i; break; } // MOV @Ri,#imm
      case 0x78: case 0x79: case 0x7A: case 0x7B: case 0x7C: case 0x7D: case 0x7E: case 0x7F: { this.setR(op - 0x78, this.fetch()); break; } // MOV Rn,#imm
      case 0x82: { const bit = this.fetch(); cyc = 2; this.cy = this.cy & this.readBit(bit); break; } // ANL C,bit
      case 0x83: { this.acc = this.code[(this.acc + this.pc) & 0xFFFF]; cyc = 2; break; } // MOVC A,@A+PC
      case 0x84: { // DIV AB
        cyc = 4;
        const b = this.b;
        let psw = this.psw & ~(PSW_CY | PSW_OV);
        if (b === 0) { psw |= PSW_OV; }
        else { const q = Math.floor(this.acc / b), r = this.acc % b; this.acc = q; this.b = r; }
        this.psw = psw; break;
      }
      case 0x85: { const src = this.fetch(), dst = this.fetch(); cyc = 2; this.writeDirect(dst, this.readDirect(src, false)); break; } // MOV direct,direct
      case 0x86: case 0x87: { const dst = this.fetch(); cyc = 2; this.writeDirect(dst, this.iram[this.getR(op - 0x86)]); break; } // MOV direct,@Ri
      case 0x88: case 0x89: case 0x8A: case 0x8B: case 0x8C: case 0x8D: case 0x8E: case 0x8F: { const dst = this.fetch(); cyc = 2; this.writeDirect(dst, this.getR(op - 0x88)); break; } // MOV direct,Rn
      case 0x90: { const h = this.fetch(), l = this.fetch(); cyc = 2; this.dptr = (h << 8) | l; break; } // MOV DPTR,#imm16
      case 0x92: { const bit = this.fetch(); cyc = 2; this.writeBit(bit, this.cy); break; } // MOV bit,C
      case 0x93: { this.acc = this.code[(this.acc + this.dptr) & 0xFFFF]; cyc = 2; break; } // MOVC A,@A+DPTR
      case 0x94: { this.acc = this.sub(this.acc, this.fetch(), this.cy); break; } // SUBB A,#imm
      case 0x95: case 0x96: case 0x97: case 0x98: case 0x99: case 0x9A: case 0x9B: case 0x9C: case 0x9D: case 0x9E: case 0x9F: {
        const [v] = operandRead(false); this.acc = this.sub(this.acc, v, this.cy); break;
      }
      case 0xA0: { const bit = this.fetch(); cyc = 2; this.cy = this.cy | (this.readBit(bit) ^ 1); break; } // ORL C,/bit
      case 0xA2: { const bit = this.fetch(); this.cy = this.readBit(bit); break; } // MOV C,bit
      case 0xA3: { this.dptr = (this.dptr + 1) & 0xFFFF; cyc = 2; break; } // INC DPTR
      case 0xA4: { // MUL AB
        cyc = 4;
        const r = this.acc * this.b;
        this.acc = r & 0xFF; this.b = r >> 8;
        let psw = this.psw & ~(PSW_CY | PSW_OV);
        if (r > 0xFF) psw |= PSW_OV;
        this.psw = psw; break;
      }
      case 0xA5: break; // 未定義
      case 0xA6: case 0xA7: { const src = this.fetch(); cyc = 2; this.iram[this.getR(op - 0xA6)] = this.readDirect(src, false); break; } // MOV @Ri,direct
      case 0xA8: case 0xA9: case 0xAA: case 0xAB: case 0xAC: case 0xAD: case 0xAE: case 0xAF: { const src = this.fetch(); cyc = 2; this.setR(op - 0xA8, this.readDirect(src, false)); break; } // MOV Rn,direct
      case 0xB0: { const bit = this.fetch(); cyc = 2; this.cy = this.cy & (this.readBit(bit) ^ 1); break; } // ANL C,/bit
      case 0xB2: { const bit = this.fetch(); this.writeBit(bit, this.readBitLatch(bit) ^ 1); break; } // CPL bit
      case 0xB3: { this.cy = this.cy ^ 1; break; } // CPL C
      case 0xB4: { const i = this.fetch(), rel = (this.fetch() << 24) >> 24; cyc = 2; this.cy = this.acc < i ? 1 : 0; if (this.acc !== i) this.pc = (this.pc + rel) & 0xFFFF; break; } // CJNE A,#imm,rel
      case 0xB5: { const a = this.fetch(), rel = (this.fetch() << 24) >> 24; cyc = 2; const v = this.readDirect(a, false); this.cy = this.acc < v ? 1 : 0; if (this.acc !== v) this.pc = (this.pc + rel) & 0xFFFF; break; } // CJNE A,direct,rel
      case 0xB6: case 0xB7: { const i = this.fetch(), rel = (this.fetch() << 24) >> 24; cyc = 2; const v = this.iram[this.getR(op - 0xB6)]; this.cy = v < i ? 1 : 0; if (v !== i) this.pc = (this.pc + rel) & 0xFFFF; break; } // CJNE @Ri,#imm,rel
      case 0xB8: case 0xB9: case 0xBA: case 0xBB: case 0xBC: case 0xBD: case 0xBE: case 0xBF: { const i = this.fetch(), rel = (this.fetch() << 24) >> 24; cyc = 2; const v = this.getR(op - 0xB8); this.cy = v < i ? 1 : 0; if (v !== i) this.pc = (this.pc + rel) & 0xFFFF; break; } // CJNE Rn,#imm,rel
      case 0xC0: { const a = this.fetch(); cyc = 2; this.push(this.readDirect(a, false)); break; } // PUSH
      case 0xC2: { const bit = this.fetch(); this.writeBit(bit, 0); break; } // CLR bit
      case 0xC3: { this.cy = 0; break; } // CLR C
      case 0xC4: { this.acc = ((this.acc << 4) | (this.acc >> 4)) & 0xFF; break; } // SWAP A
      case 0xC5: { const a = this.fetch(); const v = this.readDirect(a, false); this.writeDirect(a, this.acc); this.acc = v; break; } // XCH A,direct
      case 0xC6: case 0xC7: { const a = this.getR(op - 0xC6); const v = this.iram[a]; this.iram[a] = this.acc; this.acc = v; break; } // XCH A,@Ri
      case 0xC8: case 0xC9: case 0xCA: case 0xCB: case 0xCC: case 0xCD: case 0xCE: case 0xCF: { const n = op - 0xC8; const v = this.getR(n); this.setR(n, this.acc); this.acc = v; break; } // XCH A,Rn
      case 0xD0: { const a = this.fetch(); cyc = 2; this.writeDirect(a, this.pop()); break; } // POP
      case 0xD2: { const bit = this.fetch(); this.writeBit(bit, 1); break; } // SETB bit
      case 0xD3: { this.cy = 1; break; } // SETB C
      case 0xD4: { // DA A
        let a = this.acc, cy = this.cy;
        if ((a & 0x0F) > 9 || (this.psw & PSW_AC)) { a += 6; if (a > 0xFF) cy = 1; a &= 0xFF; }
        if ((a & 0xF0) > 0x90 || cy) { a += 0x60; if (a > 0xFF) cy = 1; a &= 0xFF; }
        this.acc = a; this.cy = cy; break;
      }
      case 0xD5: { const a = this.fetch(), rel = (this.fetch() << 24) >> 24; cyc = 2; const v = (this.readDirect(a, true) - 1) & 0xFF; this.writeDirect(a, v); if (v !== 0) this.pc = (this.pc + rel) & 0xFFFF; break; } // DJNZ direct,rel
      case 0xD6: case 0xD7: { // XCHD A,@Ri
        const a = this.getR(op - 0xD6); const v = this.iram[a];
        this.iram[a] = (v & 0xF0) | (this.acc & 0x0F); this.acc = (this.acc & 0xF0) | (v & 0x0F); break;
      }
      case 0xD8: case 0xD9: case 0xDA: case 0xDB: case 0xDC: case 0xDD: case 0xDE: case 0xDF: { const rel = (this.fetch() << 24) >> 24; cyc = 2; const n = op - 0xD8; const v = (this.getR(n) - 1) & 0xFF; this.setR(n, v); if (v !== 0) this.pc = (this.pc + rel) & 0xFFFF; break; } // DJNZ Rn,rel
      case 0xE0: { this.acc = this.xram[this.dptr]; cyc = 2; break; } // MOVX A,@DPTR
      case 0xE2: case 0xE3: { this.acc = this.xram[(this.bus.latch[2] << 8) | this.getR(op - 0xE2)]; cyc = 2; break; } // MOVX A,@Ri
      case 0xE4: { this.acc = 0; break; } // CLR A
      case 0xE5: { const a = this.fetch(); this.acc = this.readDirect(a, false); break; } // MOV A,direct
      case 0xE6: case 0xE7: { this.acc = this.iram[this.getR(op - 0xE6)]; break; } // MOV A,@Ri
      case 0xE8: case 0xE9: case 0xEA: case 0xEB: case 0xEC: case 0xED: case 0xEE: case 0xEF: { this.acc = this.getR(op - 0xE8); break; } // MOV A,Rn
      case 0xF0: { this.xram[this.dptr] = this.acc; cyc = 2; break; } // MOVX @DPTR,A
      case 0xF2: case 0xF3: { this.xram[(this.bus.latch[2] << 8) | this.getR(op - 0xF2)] = this.acc; cyc = 2; break; } // MOVX @Ri,A
      case 0xF4: { this.acc = ~this.acc; break; } // CPL A
      case 0xF5: { const a = this.fetch(); this.writeDirect(a, this.acc); break; } // MOV direct,A
      case 0xF6: case 0xF7: { this.iram[this.getR(op - 0xF6)] = this.acc; break; } // MOV @Ri,A
      case 0xF8: case 0xF9: case 0xFA: case 0xFB: case 0xFC: case 0xFD: case 0xFE: case 0xFF: { this.setR(op - 0xF8, this.acc); break; } // MOV Rn,A
      default:
        break;
    }

    this.tick(cyc);
    this.checkInterrupts();
    return cyc;
  }

  readBitLatch(bit) {
    const byte = bitAddrToByte(bit), mask = bitAddrToMask(bit);
    return (this.readDirect(byte, true) & mask) ? 1 : 0;
  }

  // ---------- 週期推進：計時器、UART、外部中斷取樣 ----------
  tick(n) {
    for (let i = 0; i < n; i++) {
      this.cycles++;
      this.tickTimers();
      this.tickUart();
      this.sampleExternalInts();
    }
  }

  tickTimers() {
    const tcon = this.sfr[SFR.TCON - 0x80];
    const tmod = this.sfr[SFR.TMOD - 0x80];
    const p3 = this.bus.pins[3];
    // Timer 0
    if (tcon & TCON_TR0) {
      const gate = tmod & 0x08, ct = tmod & 0x04, mode = tmod & 0x03;
      const run = !gate || ((p3 >> 2) & 1);
      let inc = false;
      if (ct) { const t0 = (p3 >> 4) & 1; if (this.prevT0 === 1 && t0 === 0) inc = true; }
      else inc = true;
      if (run && inc) this.incTimer(0, mode);
    }
    this.prevT0 = (p3 >> 4) & 1;
    // Timer 1
    if (tcon & TCON_TR1) {
      const gate = tmod & 0x80, ct = tmod & 0x40, mode = (tmod >> 4) & 0x03;
      const run = !gate || ((p3 >> 3) & 1);
      let inc = false;
      if (ct) { const t1 = (p3 >> 5) & 1; if (this.prevT1 === 1 && t1 === 0) inc = true; }
      else inc = true;
      if (run && inc && mode !== 3) this.incTimer(1, mode);
    }
    this.prevT1 = (p3 >> 5) & 1;
  }

  incTimer(t, mode) {
    const TL = (t === 0 ? SFR.TL0 : SFR.TL1) - 0x80, TH = (t === 0 ? SFR.TH0 : SFR.TH1) - 0x80;
    const TF = t === 0 ? TCON_TF0 : TCON_TF1;
    const s = this.sfr;
    switch (mode) {
      case 0: { // 13-bit
        let v = ((s[TH] << 5) | (s[TL] & 0x1F)) + 1;
        if (v > 0x1FFF) { v = 0; s[SFR.TCON - 0x80] |= TF; if (t === 1) this.t1Overflow(); }
        s[TH] = (v >> 5) & 0xFF; s[TL] = v & 0x1F; break;
      }
      case 1: { // 16-bit
        let v = ((s[TH] << 8) | s[TL]) + 1;
        if (v > 0xFFFF) { v = 0; s[SFR.TCON - 0x80] |= TF; if (t === 1) this.t1Overflow(); }
        s[TH] = v >> 8; s[TL] = v & 0xFF; break;
      }
      case 2: { // 8-bit auto reload
        let v = s[TL] + 1;
        if (v > 0xFF) { v = s[TH]; s[SFR.TCON - 0x80] |= TF; if (t === 1) this.t1Overflow(); }
        s[TL] = v; break;
      }
      case 3: { // Timer0 split: TL0 為 timer0, TH0 為 timer1 (使用 TR1/TF1)
        if (t === 0) {
          let v = s[TL] + 1;
          if (v > 0xFF) { v = 0; s[SFR.TCON - 0x80] |= TCON_TF0; }
          s[TL] = v;
          if (s[SFR.TCON - 0x80] & TCON_TR1) {
            let h = s[TH] + 1;
            if (h > 0xFF) { h = 0; s[SFR.TCON - 0x80] |= TCON_TF1; }
            s[TH] = h;
          }
        }
        break;
      }
    }
  }

  t1Overflow() { this.t1OverflowsForBaud++; }

  sampleExternalInts() {
    const p3 = this.bus.pins[3];

      else if (labelSide === 'split') { if (c === 0) { lx = px - P(5.5); anchor = 'end'; } else { lx = px + P(5.5); anchor = 'start'; } ly = py + 3; }
      else { lx = px + P(5.5); ly = py + 3; anchor = 'start'; }
      const dupCol = cols === 2 && ((labelSide === 'right' && c === 0) || (labelSide === 'left' && c === 1));
      if (name && !spec.bare && !dupCol) txt(grp, lx, ly, name, { 'font-size': spec.labelSize || 11, 'text-anchor': anchor, fill: on || clickable ? SILK : '#8d8d93' });
      if (dev) {
        grp.addEventListener('click', (e) => { e.stopPropagation(); this._devClicked(dev); });
        this._tip(grp, `${spec.id} 第 ${i + 1} 腳 — ${name}`, spec.note || '');
        (this.devEls[dev] = this.devEls[dev] || []).push({ x: px, y: py, dot });
      } else if (port) {
        grp.addEventListener('click', (e) => { e.stopPropagation(); this._portClicked(port); });
        this._tip(grp, `${spec.id} 第 ${i + 1} 腳 — ${name}`,
          MAIN_FIXED[port] ? `板上已焊：<b>${MAIN_FIXED[port]}</b>` : '');
        (this.portPins[port] = this.portPins[port] || []).push({ x: px, y: py, dot });
      } else if (rail) {
        grp.addEventListener('click', (e) => { e.stopPropagation(); this._railClicked(rail); });
        this._tip(grp, `${spec.id} 第 ${i + 1} 腳 — ${name}`,
          rail === 'gnd' ? '點它再點任一支埠腳，那支腳就被<b>拉到 0</b>。'
                         : '點它再點任一支埠腳，那支腳就被<b>拉到 1</b>。<br>⚠ 程式對它寫 0 = 短路。');
        (this.railEls[rail] = this.railEls[rail] || []).push({ dot });
      } else if (ctrl) {
        grp.addEventListener('click', (e) => { e.stopPropagation(); this._ctrlClicked(ctrl); });
        this._tip(grp, `${spec.id} 第 ${i + 1} 腳 — ${name}`,
          ctrl === 'RST' ? '接 <b>VCC</b> = 一直被按住重置，程式不會跑。'

        (this.ctrlEls[ctrl] = this.ctrlEls[ctrl] || []).push({ dot });
      } else if (jmp) {
        grp.addEventListener('click', (e) => { e.stopPropagation(); this._jumperClicked(jmp); });
        this._tip(grp, `${spec.id} 第 ${i + 1} 腳 — ${name}`,
          '短接 = LM35 送進 ADC 的 <b>CH1</b>，拔掉 CH1 讀到 0V。點一下切換。');
        (this.jmpEls[jmp] = this.jmpEls[jmp] || []).push({ x: px, y: py, dot });
      } else if (kind === 'out') {
        this._tip(grp, `${spec.id} 第 ${i + 1} 腳 — ${name}`,
          val === 'adcCh1' ? 'ADC 的 CH1 輸入，電壓看「類比與環境」面板。'
            : `DAC 的 ${val === 'dacA' ? 'CHA' : 'CHB'} 輸出，電壓看「類比與環境」面板。`);
      } else if (kind === 'fixed') {
        this._tip(grp, `${spec.id} 第 ${i + 1} 腳 — ${name}`,
          '馬達出廠就插好，不用接。要接的是 JP7 的 B2 B1 A2 A1。');
      } else {
        this._tip(grp, `${spec.id} 第 ${i + 1} 腳 — ${name}`,
          kind === 'na' ? `模擬不了：${val}` : (NON_IO[name] || ''));
      }
    });
    return g;
  }

    if (a !== c.pc) { addrs.length = 0; a = c.pc; } // 對不齊時直接從 PC 開始
    const before = addrs.slice(-12);
    let html = '';
    const emit = (addr) => {
      const d = disasm(c.code, addr);
      let bytes = ''; for (let i = 0; i < d.len; i++) bytes += hex2(c.code[(addr + i) & 0xFFFF]) + ' ';
      const line = this.sim.lineByAddr.get(addr);
      const cls = (addr === c.pc ? ' cur' : '') + (c.breakpoints.has(addr) ? ' bp' : '');
      html += `<div class="line${cls}" data-addr="${addr}"><div class="gutter"></div><div class="addr">${hex4(addr)}</div><div class="bytes">${bytes}</div><div class="cline">${line != null ? 'L' + line : ''}</div><div class="txt">${esc(d.text)}</div></div>`;
      return d.len;
    };
    for (const addr of before) emit(addr);
    a = c.pc;
    for (let i = 0; i < 28 && a < 0x10000; i++) a += emit(a);
    this.root.innerHTML = html;
    for (const row of this.root.querySelectorAll('.line')) row.querySelector('.gutter').addEventListener('click', () => this.onToggleBp(+row.dataset.addr));
    const cur = this.root.querySelector('.line.cur'); if (cur) cur.scrollIntoView({ block: 'center' });
  }

        else if (s.space === 'F' || s.space === 'X') { for (let i = 0; i < sz; i++) v += hex2(c.xram[(s.addr + i) & 0xFFFF]) + ' '; }
        else if (s.space === 'C') { for (let i = 0; i < sz; i++) v += hex2(c.code[(s.addr + i) & 0xFFFF]) + ' '; }
        else if (s.space === 'H') { v = ((c.readDirect((s.addr >> 3) < 0x10 ? 0x20 + ((s.addr >> 3) - 0) : s.addr & 0xF8, true) >> (s.addr & 7)) & 1) ? '1' : '0'; }
        else continue;
        html += `<div><b style="color:#9aa3b2">${esc(n)}</b> <span style="color:#7c8aa0">${{ E: 'data', I: 'idata', F: 'xdata', X: 'xdata', C: 'code', H: 'bit' }[s.space] || s.space}@${hex4(s.addr)}</span> ${v}${(s.size || 1) > 4 ? '…' : ''}</div>`;
      }
      html += '</div>';
    }
    this.root.innerHTML = html;
    this.prevIram.set(c.iram);
  }
}

// ---------- 波形（邏輯分析儀） ----------
class WavePanel {
  constructor(root, sim) {
    this.root = root; this.sim = sim;
    this.selected = ['P1.0', 'P1.1', 'P3.7', 'P3.2', 'P3.0', 'P0.0'];
    this.windowUs = 10000;
    this.paused = false;
    root.innerHTML = '';
    const ctl = h('div', 'ctl');
    const wsel = document.createElement('select');
    for (const [v, l] of [[200, '200 µs'], [1000, '1 ms'], [5000, '5 ms'], [10000, '10 ms'], [50000, '50 ms'], [200000, '200 ms'], [1000000, '1 s'], [5000000, '5 s']]) { const o = document.createElement('option'); o.value = v; o.textContent = l; if (v === this.windowUs) o.selected = true; wsel.appendChild(o); }
    wsel.addEventListener('change', () => { this.windowUs = +wsel.value; this.draw(); });
    ctl.appendChild(h('span', null, '時間視窗 ')); ctl.appendChild(wsel);
    const pause = h('button', null, '⏸ 凍結'); pause.addEventListener('click', () => { this.paused = !this.paused; pause.textContent = this.paused ? '▶ 跟隨' : '⏸ 凍結'; }); ctl.appendChild(pause);
    const pins = h('div', 'pins');
    for (let p = 0; p < 4; p++) for (let b = 0; b < 8; b++) {
      const name = `P${p}.${b}`;
      const lab = document.createElement('label'); const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = this.selected.includes(name);
      cb.addEventListener('change', () => { if (cb.checked) this.selected.push(name); else this.selected = this.selected.filter(x => x !== name); this.selected.sort(); this.draw(); });
      lab.appendChild(cb); lab.appendChild(document.createTextNode(name)); pins.appendChild(lab);
    }
    ctl.appendChild(pins);
    root.appendChild(ctl);
    this.canvas = document.createElement('canvas'); root.appendChild(this.canvas);
    this.info = h('div', null, ''); this.info.style.cssText = 'font-family:var(--mono);font-size:11px;color:var(--muted)'; root.appendChild(this.info);
    this.canvas.addEventListener('mousemove', (e) => this._hover(e));
  }
  draw() {
    if (this.paused) return;
    const cv = this.canvas, dpr = window.devicePixelRatio || 1;
    const W = cv.clientWidth, H = Math.max(120, cv.clientHeight);
    if (!W) return;
    if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#101216'; ctx.fillRect(0, 0, W, H);
    const chans = this.selected.map(n => { const m = /^P(\d)\.(\d)$/.exec(n); return { name: n, port: +m[1], bit: +m[2] }; });
    if (!chans.length) return;
    const la = this.sim.la;
    const tEnd = this.sim.cpu.cycles, tStart = tEnd - this.windowUs;
    const left = 44, rowH = Math.min(36, (H - 18) / chans.length);
    const xOf = (t) => left + (t - tStart) / this.windowUs * (W - left - 4);
    // 格線
    ctx.strokeStyle = '#2a2e36'; ctx.lineWidth = 1; ctx.font = '10px monospace'; ctx.fillStyle = '#7c8aa0';
    const div = 10;
    for (let i = 0; i <= div; i++) { const x = left + (W - left - 4) * i / div; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H - 14); ctx.stroke(); const us = this.windowUs * (i - div) / div; ctx.fillText(us === 0 ? 'now' : (Math.abs(us) >= 1000 ? (us / 1000).toFixed(us % 1000 ? 1 : 0) + 'ms' : us + 'µs'), x - 12, H - 3); }
    // 各通道：從最新往回走
    chans.forEach((ch, i) => {
      const y0 = i * rowH + 6, y1 = y0 + rowH - 10;
      ctx.fillStyle = '#c9d1d9'; ctx.fillText(ch.name, 2, y0 + rowH / 2);
      ctx.strokeStyle = ['#4da3ff', '#4ade80', '#f5b942', '#ff7ab3', '#b39ddb', '#7fdbff', '#ffd166', '#ff8c42'][i % 8]; ctx.lineWidth = 1.5;
      ctx.beginPath();
      let prevT = tEnd, prevV = (this.sim.bus.pins[ch.port] >> ch.bit) & 1;
      ctx.moveTo(xOf(tEnd), prevV ? y0 : y1);
      let done = false;
      la.eachBackward((t, pins) => {
        const v = (pins[ch.port] >> ch.bit) & 1;
        if (t < tStart) { ctx.lineTo(xOf(tStart), prevV ? y0 : y1); done = true; return false; }
        if (v !== prevV) { ctx.lineTo(xOf(t), prevV ? y0 : y1); ctx.lineTo(xOf(t), v ? y0 : y1); prevV = v; }
        prevT = t;
      });
      if (!done) ctx.lineTo(xOf(Math.max(tStart, 0)), prevV ? y0 : y1);
      ctx.stroke();
    });
    this._geom = { left, W, rowH, chans, tStart };
  }
  _hover(e) {
    if (!this._geom) return;
    const { left, W, tStart } = this._geom;
    const x = e.offsetX;
    const t = tStart + (x - left) / (W - left - 4) * this.windowUs;
    this.info.textContent = `游標：t = ${(t / 1000).toFixed(3)} ms（距現在 ${((this.sim.cpu.cycles - t) / 1000).toFixed(3)} ms）`;
  }
}

// ---------- 週邊監視 ----------
class PeriphPanel {
  constructor(root, sim) { this.root = root; this.sim = sim; root.innerHTML = ''; this.boxes = {}; for (const k of ['lcd', 'uart', 'spi', 'i2c', 'stepper', 'keypad']) { const b = h('div', 'box'); b.appendChild(h('h4', null, { lcd: 'LCD 命令記錄', uart: 'UART 送出 (TXD)', spi: 'SPI ADC/DAC', i2c: 'I²C 匯流排', stepper: '步進馬達', keypad: '鍵盤 / 開關' }[k])); const pre = h('pre'); b.appendChild(pre); root.appendChild(b); this.boxes[k] = pre; } }
  update() {
    const s = this.sim;
    const lcd = s.lcd;
    this.boxes.lcd.textContent = `模式 ${lcd.dl8 ? '8-bit' : '4-bit'}  ${lcd.lines2 ? '2行' : '1行'}  顯示${lcd.displayOn ? 'ON' : 'OFF'}  AC=${hex2(lcd.ac)}${lcd.cgMode ? '(CG)' : ''}  忙碌:${lcd.busy ? '是' : '否'}\n` + lcd.log.slice(-40).join(' ');
    const uart = s.uartOut.map(b => b === 10 ? '\n' : b === 13 ? '' : (b >= 32 && b < 127 ? String.fromCharCode(b) : `<${hex2(b)}>`)).join('');
    this.boxes.uart.textContent = uart.slice(-2000) || '（尚無輸出；SCON/TMOD/TH1 設定後寫 SBUF）';
    this.boxes.spi.textContent = `ADC CH0=${s.spi.channelCode(0)} (${s.spi.potVolts.toFixed(2)}V)  CH1=${s.spi.channelCode(1)} (${(s.spi.tempC * 0.01).toFixed(3)}V)\nDAC A=${s.spi.dac.latchA} → ${s.spi.voutA.toFixed(3)}V  B=${s.spi.dac.latchB} → ${s.spi.voutB.toFixed(3)}V\n` + s.spi.log.slice(-12).join('\n');
    this.boxes.i2c.textContent = `狀態 ${s.i2c.state}  從屬 ${s.i2c.slave || '-'}  TC74=${Math.round(s.i2c.tempC)}°C\n` + s.i2c.log.slice(-16).join('\n') + `\nEEPROM[0..15]: ` + Array.from(s.i2c.eeprom.subarray(0, 16)).map(hex2).join(' ');
    const st = s.stepper;
    this.boxes.stepper.textContent = `線圈 A1=${(st.coils >> 0) & 1} B1=${(st.coils >> 1) & 1} A2=${(st.coils >> 2) & 1} B2=${(st.coils >> 3) & 1}\n角度 ${(((st.angle % 360) + 360) % 360).toFixed(1)}°  淨半步 ${st.halfSteps}  方向 ${st.direction > 0 ? '正' : st.direction < 0 ? '反' : '-'}\n步距 ${st.stepIntervalUs} µs  ${st.rpm.toFixed(1)} rpm  失步 ${st.missed}`;
    const pressed = []; for (let i = 0; i < 16; i++) if (s.keypad.pressed[i]) pressed.push('PB' + i);
    this.boxes.keypad.textContent = `鍵盤按下：${pressed.join(' ') || '無'}\nSW1：${Array.from(s.dip.on).map((v, i) => `P0.${i}=${v ? 'ON' : 'off'}`).join(' ')}\n按鍵：${Array.from(s.buttons.pressed).map((v, i) => `PB${i + 1}=${v ? '按' : '-'}`).join(' ')}`;
  }
}

// ---------- 接線設定（只顯示狀態；實際接線在板子上點針腳）----------
class WiringPanel {
  constructor(root, sim, api) { this.root = root; this.sim = sim; this.api = api; this.build(); }
  build() {
    const root = this.root; root.innerHTML = '';
    const tools = h('div', 'wtools');
    tools.appendChild(h('span', null, '接線方式：在板子上點一支針腳，再點另一支針腳。再點一次已接的腳就拆線。'));
    root.appendChild(tools);

    const pr = h('div', 'wtools');
    pr.appendChild(h('span', null, 'Preset：'));
    const sel = document.createElement('select'); pr.appendChild(sel);
    const load = h('button', null, '載入'); const save = h('button', null, '另存…'); const clr = h('button', null, '全部拆線');
    pr.appendChild(load); pr.appendChild(save); pr.appendChild(clr);
    root.appendChild(pr);
    this.api.listPresets().then(list => { sel.innerHTML = '<option value="">（選擇）</option>' + list.map(n => `<option>${esc(n)}</option>`).join(''); });
    load.addEventListener('click', async () => { if (!sel.value) return; const c = await this.api.loadPreset(sel.value); if (c) { this.sim.wiring.set(c); this.build(); this.api.onWiringChanged(); } });
    save.addEventListener('click', async () => { const n = prompt('Preset 名稱：'); if (!n) return; await this.api.savePreset(n, this.sim.wiring.cfg); this.build(); });
    clr.addEventListener('click', () => { if (this.api.disconnectAll) this.api.disconnectAll(); this.build(); });

    const cfg = this.sim.wiring.cfg;
    const groups = [
      ['七段顯示器', [['段 a–dp (JP3)', cfg.seg, ['a','b','c','d','e','f','g','dp']], ['位選 X0–X7 (JP4)', cfg.digit, ['X0','X1','X2','X3','X4','X5','X6','X7']], ['74LS138 (JP5)', cfg.dec138, ['A','B','C']]]],
      ['LED 陣列', [['列 R1–R8 (JP6)', cfg.matrixRow, ['R1','R2','R3','R4','R5','R6','R7','R8']]]],
      ['4×4 鍵盤', [['掃描輸出 (JP8)', cfg.keyOut, ['KO0','KO1','KO2','KO3']], ['讀回 (JP8)', cfg.keyIn, ['KI0','KI1','KI2','KI3']]]],
      ['步進馬達', [['S0–S3 (JP7)', cfg.stepper, ['S0','S1','S2','S3']]]],
      ['ADC / DAC', [['JP10', [cfg.spiSck, cfg.spiSdi, cfg.spiSdo, cfg.adcCs, cfg.dacCs, cfg.dacLd], ['SCK','SDI','SDO','ADC_CS','DAC_CS','LDAC']]]],
      ['I²C', [['JP1', [cfg.sda, cfg.scl], ['SDA','SCL']]]],
    ];
    for (const [gname, rows] of groups) {
      const any = rows.some(r => (r[1] || []).some(Boolean));
      const gh = h('div', 'grp'); gh.appendChild(h('span', null, gname + (any ? '  ●' : '  ○ 未接線')));
      root.appendChild(gh);
      for (const [title, arr, names] of rows) {
        const row = h('div', 'conn');
        row.appendChild(h('div', null, title));
        const list = h('div', 'wlist');
        names.forEach((n, i) => {
          const v = (arr || [])[i];
          const d = h('div', v ? null : 'none', `${n} → ${v || '未接'}`);
          list.appendChild(d);
        });
        row.appendChild(list);
        root.appendChild(row);
      }
    }
    this.conf = h('div', 'conf'); root.appendChild(this.conf);
    const cs = this.sim.wiring.conflicts();
    this.conf.innerHTML = cs.length ? cs.map(c => `<div class="${c.level}">${c.level === 'error' ? '✖' : '⚠'} ${esc(c.msg)}</div>`).join('') : '<div style="color:var(--ok)">✔ 沒有接線衝突</div>';
  }
}

// ---------- 輸出 ----------
class OutputPanel {
  constructor(root, onJump) { this.root = root; this.onJump = onJump; this.diags = []; this.notes = []; this.mem = ''; this.warnings = []; this.status = ''; }
  setCompile(res) { this.diags = res.diagnostics || []; this.notes = res.notes || []; this.mem = res.mem || ''; this.status = res.ok ? `✔ 編譯成功（${res.chip}）` : '✖ 編譯失敗'; this.render(); }
  setWarnings(w) { const s = w.join('\n'); if (s !== this._lastW) { this._lastW = s; this.warnings = w; this.render(); } }
  render() {
    let html = `<div style="color:${this.status.startsWith('✔') ? 'var(--ok)' : 'var(--err)'}">${esc(this.status)}</div>`;
    if (this.diags.length) { html += '<h4>編譯訊息（點擊跳到該行）</h4>'; for (const d of this.diags) html += `<div class="diag ${d.severity}" data-line="${d.line}">${d.line ? `第 ${d.line} 行：` : ''}${esc(d.msg)}</div>`; }
    if (this.notes.length) html += '<h4>相容層備註</h4>' + this.notes.map(n => `<div>${esc(n)}</div>`).join('');
    if (this.warnings.length) html += '<h4 style="color:var(--warn)">模擬器警告</h4>' + this.warnings.map(n => `<div style="color:var(--warn)">⚠ ${esc(n)}</div>`).join('');
    if (this.mem) html += `<h4>記憶體用量</h4><pre>${esc(this.mem.trim())}</pre>`;
    this.root.innerHTML = html;
    for (const d of this.root.querySelectorAll('.diag')) d.addEventListener('click', () => this.onJump(+d.dataset.line));
  }
}

const PROGRAMS = [{"name":"CH2-7-1 嗶嗶電路.asm","source":";==== 2-7-1 嗶嗶電路 =================================\n; 指撥開關 SW1 的 P0.0 撥到 ON，蜂鳴器持續發出 1KHz 嗶聲\n; 接線：Switch = P0.0（ON 讀 0）、Buzzer = P3.7（寫 0 響）\nSwitch\tEQU\tP0.0\t\t;設定指撥開關位址\nBuzzer\tEQU\tP3.7\t\t;設定蜂鳴器位址\n;==== 主程式 =========================================\n\tORG\t0\t\t;程式從 0 位址開始\nSTART:\tSETB\tSwitch\t\t;規劃輸入埠\n\tSETB\tBuzzer\t\t;設定蜂鳴器之初始狀態\n\tJNB\tSwitch,Beep\t;若指撥開關按下，則呼叫嗶嗶副程式\n\tJMP\tSTART\t\t;重新開始執行\n;==== 嗶嗶副程式 =====================================\nBeep:\tMOV\tR0,#100\t\t;計數量填入 R0\nLOOP:\tCLR\tBuzzer\t\t;低態輸出到蜂鳴器\n\tCALL\tDELAY500us\t;呼叫延時副程式(0.5ms)\n\tSETB\tBuzzer\t\t;高態輸出到蜂鳴器\n\tCALL\tDELAY500us\t;呼叫延時副程式(0.5ms)\n\tDJNZ\tR0,LOOP\t\t;若未達 100 次, 則再驅動蜂鳴器\n\tCALL\tDELAY100ms\t;靜音(0.1s)\n\tJMP\tSTART\t\t;重新開始執行\n;==== 延時副程式(0.5ms) ==============================\nDELAY500us:\n\tMOV\tR7,#250\t\t;R7 暫存器載入 250 次數\n\tDJNZ\tR7,$\t\t;本列執行 R7 次\n\tRET\t\t\t;返回主程式\n;==== 延時副程式(0.1 秒) =============================\nDELAY100ms:\n\tMOV\tR7,#200\t\t;R7 暫存器載入 200 次數\nD1:\tMOV\tR6,#250\t\t;R6 暫存器載入 250 次數\n\tDJNZ\tR6,$\t\t;本列執行 R6 次\n\tDJNZ\tR7,D1\t\t;D1 迴圈執行 R7 次\n\tRET\t\t\t;返回主程式\n\tEND\t\t\t;結束程式\n","hex":"","lines":[],"symbols":{},"mem":"","asm":true},{"name":"CH2-7-1T 1K2K交替嗶聲.asm","source":";==== 2-7-1 思考題：1KHz、2KHz 交替嗶聲 ==============\n; 原題：嗶聲固定 1KHz，如何改成 1KHz、2KHz 交替？\n; 作法：把「嗶一段」抽成共用副程式 BEEP_N，用 R1 帶入半週期延時的迴圈次數，\n;       1KHz → 半週期 500us（R1=250）、2KHz → 半週期 250us（R1=125）。\n;       兩者都嗶 0.1 秒，所以 2KHz 的翻轉次數要加倍（R0=100 / 200）。\nSwitch\tEQU\tP0.0\t\t;設定指撥開關位址\nBuzzer\tEQU\tP3.7\t\t;設定蜂鳴器位址\n;==== 主程式 =========================================\n\tORG\t0\nSTART:\tSETB\tSwitch\t\t;規劃輸入埠\n\tSETB\tBuzzer\t\t;蜂鳴器初始狀態(不響)\n\tJNB\tSwitch,BOTH\t;開關撥 ON 則交替嗶兩聲\n\tJMP\tSTART\n;==== 交替嗶聲 =======================================\nBOTH:\tMOV\tR0,#100\t\t;1KHz：100 個週期 = 0.1 秒\n\tMOV\tR1,#250\t\t;半週期延時次數 → 500us\n\tCALL\tBEEP_N\n\tCALL\tDELAY100ms\t;兩聲之間靜音 0.1 秒\n\tMOV\tR0,#200\t\t;2KHz：200 個週期 = 0.1 秒\n\tMOV\tR1,#125\t\t;半週期延時次數 → 250us\n\tCALL\tBEEP_N\n\tCALL\tDELAY100ms\t;靜音 0.1 秒後重來\n\tJMP\tSTART\n;==== 嗶 R0 個週期，半週期由 R1 決定 =================\n; 註：8051 沒有「暫存器對暫存器」的 MOV，MOV R7,R1 不合法，\n;     要經由 A 轉手（或寫成 MOV 07H,01H 的直接定址形式）。\nBEEP_N:\tCLR\tBuzzer\t\t;低態輸出到蜂鳴器\n\tMOV\tA,R1\n\tMOV\tR7,A\n\tDJNZ\tR7,$\t\t;半週期延時\n\tSETB\tBuzzer\t\t;高態輸出到蜂鳴器\n\tMOV\tA,R1\n\tMOV\tR7,A\n\tDJNZ\tR7,$\t\t;半週期延時\n\tDJNZ\tR0,BEEP_N\t;未達 R0 次則繼續\n\tRET\n;==== 延時副程式(0.1 秒) =============================\nDELAY100ms:\n\tMOV\tR7,#200\nD1:\tMOV\tR6,#250\n\tDJNZ\tR6,$\n\tDJNZ\tR7,D1\n\tRET\n\tEND\n","hex":"","lines":[],"symbols":{},"mem":"","asm":true},{"name":"CH2-7-2 LED移動電路.asm","source":";==== 2-7-2 LED 移動電路 =============================\n; 按一下 P2.0（板上 PB3）後，單燈由 P1.0 左移到 P1.7，每 0.3 秒一位\n; 接線：PB = P2.0（按下讀 0）、LED = P1（寫 0 亮）\nPB\tEQU\tP2.0\t\t;設定按鈕開關位址\nLED\tEQU\tP1\t\t;設定 LED 位址\n;==== 主程式 =========================================\n\tORG\t0\t\t;程式從 0 位址開始\nSTART:\tSETB\tPB\t\t;規劃輸入埠\n\tMOV\tLED,#0FFH\t;設定 LED 之初始狀態\n\tJNB\tPB,LEFT\t\t;若按鈕開關按下，則進行左移\n\tJMP\tSTART\t\t;重新開始執行\n;==== 左移副程式 =====================================\nLEFT:\tMOV\tR0,#7\t\t;計數量填入 R0\n\tMOV\tA,#11111110B\t;設定 A 之初值(11111110)\n\tMOV\tLED,A\t\t;驅動 LED\nLOOP:\tCALL\tDELAY300ms\t;呼叫延時副程式(0.3s)\n\tRL\tA\t\t;ACC 左移(右邊補 0)\n\tORL\tA,#1\t\t;ACC 最右邊設定為 1\n\tMOV\tLED,A\t\t;設定驅動 LED\n\tDJNZ\tR0,LOOP\t\t;若未達 7 次, 則再左移 LED\n\tCALL\tDELAY300ms\t;呼叫延時副程式(0.3s)\n\tJMP\tSTART\t\t;重新開始執行\n;==== 延時副程式(0.3 秒) =============================\nDELAY300ms:\n\tMOV\tR5,#3\t\t;R5 暫存器載入 3 次數\nD0:\tMOV\tR7,#200\t\t;R7 暫存器載入 200 次數\nD1:\tMOV\tR6,#250\t\t;R6 暫存器載入 250 次數\n\tDJNZ\tR6,$\t\t;本列執行 R6 次\n\tDJNZ\tR7,D1\t\t;D1 迴圈執行 R7 次\n\tDJNZ\tR5,D0\t\t;D0 迴圈執行 R5 次\n\tRET\t\t\t;返回主程式\n\tEND\t\t\t;結束程式\n","hex":"","lines":[],"symbols":{},"mem":"","asm":true},{"name":"CH2-7-2T 雙燈左移.asm","source":";==== 2-7-2 思考題：改成雙燈左移 =====================\n; 原題：單燈左移，如何改成雙燈左移？\n;\n; 注意「左移」有兩種講法，這塊板子上兩者剛好相反：\n;   暫存器的左移 = RL A = 往高位元 = P1.0 → P1.7 = 板子上由左往右\n;   板子上的左移 =          往低位元 = P1.7 → P1.0 = RR A\n; 本板 P1.0 是最左邊的 DS1、P1.7 是最右邊的 DS8（絲印上印得很清楚）。\n; 這裡取「眼睛看到的方向」：兩顆燈從最右邊往左邊跑，所以用 RR A。\n;\n; 作法：初值 00111111B（P1.6、P1.7 兩顆亮 = 最右邊的 DS7、DS8），\n;       每次 RR A 往低位元轉一格，最高位補 1 讓離開的那顆熄掉。\n;       兩顆燈從最右邊走到最左邊要 6 步，所以計數是 6。\nPB\tEQU\tP2.0\t\t;設定按鈕開關位址\nLED\tEQU\tP1\t\t;設定 LED 位址\n;==== 主程式 =========================================\n\tORG\t0\nSTART:\tSETB\tPB\t\t;規劃輸入埠\n\tMOV\tLED,#0FFH\t;LED 全滅\n\tJNB\tPB,LEFT\t\t;按鈕按下則進行雙燈左移\n\tJMP\tSTART\n;==== 雙燈左移（畫面上由右往左）=======================\nLEFT:\tMOV\tR0,#6\t\t;兩顆燈走到最左邊需要 6 步\n\tMOV\tA,#00111111B\t;初值：P1.6、P1.7 兩顆亮（最右邊 DS7、DS8）\n\tMOV\tLED,A\nLOOP:\tCALL\tDELAY300ms\n\tRR\tA\t\t;往低位元轉 = 燈往畫面左邊移動\n\tORL\tA,#10000000B\t;最高位補 1，讓右邊離開的那顆熄滅\n\tMOV\tLED,A\n\tDJNZ\tR0,LOOP\t\t;未達 6 次則繼續\n\tCALL\tDELAY300ms\n\tJMP\tSTART\t\t;回主程式，LED 全滅\n;==== 延時副程式(0.3 秒) =============================\nDELAY300ms:\n\tMOV\tR5,#3\nD0:\tMOV\tR7,#200\nD1:\tMOV\tR6,#250\n\tDJNZ\tR6,$\n\tDJNZ\tR7,D1\n\tDJNZ\tR5,D0\n\tRET\n\tEND\n","hex":"","lines":[],"symbols":{},"mem":"","asm":true},{"name":"CH2-7-3 霹靂燈電路.asm","source":";==== 2-7-3 霹靂燈電路 ===============================\n; 單燈左右來回移動，每 0.1 秒移一位，持續不斷\n; 接線：LED = P1（寫 0 亮）\nLED\tEQU\tP1\t\t;設定 LED 位址\n;==== 主程式 =========================================\n\tORG\t0\t\t;程式從 0 位址開始\nSTART:\tMOV\tA,#0FEH\t\t;設定 LED 之左移初值\n;==== 左移 ===========================================\nLEFT:\tMOV\tR0,#7\t\t;計數量填入 R0\n\tMOV\tLED,A\t\t;驅動 LED\nLOOPL:\tCALL\tDELAY100ms\t;呼叫延時副程式(0.1s)\n\tRL\tA\t\t;ACC 左移(右邊補 0)\n\tORL\tA,#1\t\t;ACC 最右邊設定為 1\n\tMOV\tLED,A\t\t;設定驅動 LED\n\tDJNZ\tR0,LOOPL\t;若未達 7 次, 則再左移 LED\n\tCALL\tDELAY100ms\t;呼叫延時副程式(0.1s)\n;==== 右移 ===========================================\nRIGHT:\tMOV\tR0,#7\t\t;計數量填入 R0\n\tMOV\tLED,A\t\t;驅動 LED\nLOOPR:\tCALL\tDELAY100ms\t;呼叫延時副程式(0.1s)\n\tRR\tA\t\t;ACC 右移(左邊補 0)\n\tORL\tA,#10000000B\t;ACC 最左邊設定為 1\n\tMOV\tLED,A\t\t;驅動 LED\n\tDJNZ\tR0,LOOPR\t;若未達 7 次, 則再右移 LED\n\tCALL\tDELAY100ms\t;呼叫延時副程式(0.1s)\n\tJMP\tSTART\t\t;重新開始執行\n;==== 延時副程式(0.1 秒) =============================\nDELAY100ms:\n\tMOV\tR7,#200\t\t;R7 暫存器載入 200 次數\nD1:\tMOV\tR6,#250\t\t;R6 暫存器載入 250 次數\n\tDJNZ\tR6,$\t\t;本列執行 R6 次\n\tDJNZ\tR7,D1\t\t;D1 迴圈執行 R7 次\n\tRET\t\t\t;返回主程式\n\tEND\t\t\t;結束程式\n","hex":"","lines":[],"symbols":{},"mem":"","asm":true},{"name":"CH2-7-3T 霹靂燈加嗶聲.asm","source":";==== 2-7-3 思考題：霹靂燈 + 兩端嗶聲 ================\n; 原題：單燈到最左邊時嗶一聲、到最右邊時嗶兩聲。\n;\n; 板子上 P1.0 = DS1 = 最左邊（課本 2-7-1 也說「指撥開關最左邊的位元(P0.0)」），\n; P1.7 = DS8 = 最右邊。A 的初值 0FEH 是 P1.0 亮，所以：\n;   RL A 這一段  → 燈由左往右跑，走完停在 P1.7 = 最右邊 → 嗶 2 聲\n;   RR A 這一段  → 燈由右往左跑，走完停在 P1.0 = 最左邊 → 嗶 1 聲\n; （課本 2-7-3 本文寫「單一個 LED 由左而右移動，到達最右邊後…」，\n;   以位置為準，不要被「左移／右移」這兩個講的是暫存器方向的字誤導。）\nLED\tEQU\tP1\t\t;設定 LED 位址\nBuzzer\tEQU\tP3.7\t\t;設定蜂鳴器位址\n;==== 主程式 =========================================\n\tORG\t0\n\tSETB\tBuzzer\t\t;蜂鳴器初始狀態(不響)\nSTART:\tMOV\tA,#0FEH\t\t;設定 LED 之左移初值\n;==== 左移 ===========================================\nLEFT:\tMOV\tR0,#7\n\tMOV\tLED,A\nLOOPL:\tCALL\tDELAY100ms\n\tRL\tA\t\t;ACC 左移(右邊補 0)\n\tORL\tA,#1\t\t;ACC 最右邊設定為 1\n\tMOV\tLED,A\n\tDJNZ\tR0,LOOPL\n\tCALL\tDELAY100ms\n\tMOV\tR1,#2\t\t;走到最右邊(P1.7) → 嗶 2 聲\n\tCALL\tBEEP_N\n;==== 右移 ===========================================\nRIGHT:\tMOV\tR0,#7\n\tMOV\tLED,A\nLOOPR:\tCALL\tDELAY100ms\n\tRR\tA\t\t;ACC 右移(左邊補 0)\n\tORL\tA,#10000000B\t;ACC 最左邊設定為 1\n\tMOV\tLED,A\n\tDJNZ\tR0,LOOPR\n\tCALL\tDELAY100ms\n\tMOV\tR1,#1\t\t;走回最左邊(P1.0) → 嗶 1 聲\n\tCALL\tBEEP_N\n\tJMP\tSTART\n;==== 嗶 R1 聲，每聲 1KHz 持續 0.1 秒 ================\nBEEP_N:\tMOV\tR0,#100\t\t;100 個週期 = 0.1 秒\nBEEP1:\tCLR\tBuzzer\n\tMOV\tR7,#250\n\tDJNZ\tR7,$\t\t;半週期 500us\n\tSETB\tBuzzer\n\tMOV\tR7,#250\n\tDJNZ\tR7,$\t\t;半週期 500us\n\tDJNZ\tR0,BEEP1\n\tCALL\tDELAY100ms\t;聲與聲之間的間隔\n\tDJNZ\tR1,BEEP_N\t;還沒嗶完則再嗶一聲\n\tRET\n;==== 延時副程式(0.1 秒) =============================\nDELAY100ms:\n\tMOV\tR7,#200\nD1:\tMOV\tR6,#250\n\tDJNZ\tR6,$\n\tDJNZ\tR7,D1\n\tRET\n\tEND\n","hex":"","lines":[],"symbols":{},"mem":"","asm":true}];

"src/asm/assembler.js": function (__e) {
// Keil A51 相容的 8051 組譯器（純 JS，不需本機服務）
//
// 支援：標記、EQU/SET/BIT/DATA/IDATA/XDATA/CODE、ORG、DB/DW/DS、END、USING
//       數值 0FFH / 0x1F / 11110000B / 77Q / 123 / 'A'
//       運算式 + - * / MOD SHL SHR AND OR XOR NOT ( ) HIGH LOW，$ 表示本行位址
//       位元位址 P1.0、ACC.7、20H.3，以及 /bit 反相
//       通用 JMP / CALL（一律組成 LJMP / LCALL，行為相同，僅長度比 Keil 最佳化後多 1 byte）
//
// 輸出：{ ok, hex, lines:[[addr,lineNo]], symbols, listing, diagnostics }

const { SFR, BIT_NAMES } = __mod("src/cpu/sfr.js");
// ---------- 預定義符號 ----------
function predefined() {
  const s = new Map();
  for (const [name, addr] of Object.entries(SFR)) s.set(name, { value: addr, kind: 'data' });
  s.set('DPTR', { value: 0x8382, kind: 'reserved' });
  // 位元名稱（TCON/IE/PSW/SCON/IP/P3 的功能名）
  for (const [addr, name] of Object.entries(BIT_NAMES)) {
    if (/^(P[0-3]|ACC|B)\./.test(name)) continue; // P1.0 這類用點記法處理
    if (!s.has(name)) s.set(name, { value: +addr, kind: 'bit' });
  }
  return s;
}

// ---------- 運算式 ----------
const NUM = /^(?:0[xX][0-9a-fA-F]+|[0-9][0-9a-fA-F]*[hH]|[01]+[bB]|[0-7]+[qQoO]|[0-9]+[dD]?)$/;

function parseNumber(t) {
  if (/^0[xX]/.test(t)) return parseInt(t.slice(2), 16);
  if (/[hH]$/.test(t)) return parseInt(t.slice(0, -1), 16);
  if (/[bB]$/.test(t) && /^[01]+[bB]$/.test(t)) return parseInt(t.slice(0, -1), 2);
  if (/[qQoO]$/.test(t)) return parseInt(t.slice(0, -1), 8);
  if (/[dD]$/.test(t)) return parseInt(t.slice(0, -1), 10);
  return parseInt(t, 10);
}

class ExprParser {
  constructor(src, ctx) { this.s = src; this.i = 0; this.ctx = ctx; }
  ws() { while (this.i < this.s.length && /\s/.test(this.s[this.i])) this.i++; }
  peekWord() {
    this.ws();
    const m = /^[A-Za-z_?][A-Za-z0-9_?]*/.exec(this.s.slice(this.i));
    return m ? m[0] : null;
  }
  eat(str) {
    this.ws();
    if (this.s.slice(this.i, this.i + str.length).toUpperCase() === str.toUpperCase()) {
      // 文字運算子後面必須是非識別字元
      if (/[A-Z]/i.test(str[0])) {
        const after = this.s[this.i + str.length];
        if (after && /[A-Za-z0-9_?]/.test(after)) return false;
      }
      this.i += str.length; return true;
    }
    return false;
  }
  parse() { const v = this.orExpr(); this.ws(); return v; }
  orExpr() {
    let v = this.xorExpr();
    for (;;) { if (this.eat('OR')) v = (v | this.xorExpr()) >>> 0; else return v; }
  }
  xorExpr() {
    let v = this.andExpr();
    for (;;) { if (this.eat('XOR')) v = (v ^ this.andExpr()) >>> 0; else return v; }
  }
  andExpr() {
    let v = this.shiftExpr();
    for (;;) { if (this.eat('AND')) v = (v & this.shiftExpr()) >>> 0; else return v; }
  }
  shiftExpr() {
    let v = this.addExpr();
    for (;;) {
      if (this.eat('SHL')) v = (v << this.addExpr()) >>> 0;
      else if (this.eat('SHR')) v = (v >>> this.addExpr()) >>> 0;
      else return v;
    }
  }
  addExpr() {
    let v = this.mulExpr();
    for (;;) {
      this.ws();
      if (this.s[this.i] === '+') { this.i++; v = v + this.mulExpr(); }
      else if (this.s[this.i] === '-') { this.i++; v = v - this.mulExpr(); }
      else return v;
    }
  }
  mulExpr() {
    let v = this.unary();
    for (;;) {
      this.ws();
      if (this.s[this.i] === '*') { this.i++; v = v * this.unary(); }
      else if (this.s[this.i] === '/') { this.i++; const d = this.unary(); v = d === 0 ? 0 : Math.trunc(v / d); }
      else if (this.eat('MOD')) { const d = this.unary(); v = d === 0 ? 0 : v % d; }
      else return v;
    }
  }
  unary() {
    this.ws();
    if (this.s[this.i] === '-') { this.i++; return -this.unary(); }
    if (this.s[this.i] === '+') { this.i++; return this.unary(); }
    if (this.eat('NOT')) return (~this.unary()) >>> 0;
    if (this.eat('HIGH')) return (this.unary() >> 8) & 0xFF;
    if (this.eat('LOW')) return this.unary() & 0xFF;
    return this.primary();
  }
  primary() {
    this.ws();
    if (this.s[this.i] === '(') { this.i++; const v = this.orExpr(); this.ws(); if (this.s[this.i] === ')') this.i++; else throw new Error('少了右括號'); return v; }
    if (this.s[this.i] === '$') { this.i++; return this.ctx.pc; }
    // 字元常數
    if (this.s[this.i] === "'" || this.s[this.i] === '"') {

function recompileFromEditor(alsoLoad) {

  const chip = CHIP;

  source.setDiagnostics(r.diagnostics);
  output.setCompile({ ...r, chip, notes: [], mem: r.ok ? `程式碼 ${r.codeBytes} 位元組` : '' });
  if (!r.ok) {
    const e = r.diagnostics.find(d => d.severity === 'error');
    $('#st-reason').textContent = e ? `第 ${e.line} 行：${e.msg}` : '組譯失敗';
    $('#st-name').textContent = `${current.name}  ✖ 組譯失敗`;

  $('#st-reason').textContent = alsoLoad ? '' : '已組譯，按 F7 重新執行';
  $('#st-name').textContent = `${current.name}  ✔ ${r.codeBytes} 位元組`;

  // 保留接線與執行狀態，只換程式
  const wasRunning = runner.running;
  sim.chip = chip;
  sim.load({ hex: r.hex, lines: r.lines, symbols: r.symbols, name: current.name });
  memory.setSymbols(r.symbols);
  sim.cpu.breakpoints.clear();
  for (const ln of bpLines) { const a = sim.addrByLine.get(ln); if (a !== undefined) sim.cpu.breakpoints.add(a); }

  setRunButton();

// 內容就是組合語言原始碼；有接線的話，第一行放一句註解把接線也帶著走。
// ';' 在 A51 裡就是註解，所以這個檔案本身仍然是可以直接組譯的組合語言。
const TAG = ';!KT89 ';
function serializeProject() {
  const src = source.getSource();
  const keep = { ...sim.wiring.cfg }; delete keep.enabled;
  const base = { ...DEFAULT_WIRING }; delete base.enabled;
  if (JSON.stringify(keep) === JSON.stringify(base)) return src;   // 沒接線就只存程式碼
  return TAG + JSON.stringify(keep) + '\n' + src;

function parseProject(text) {
  const t = String(text).replace(/^\uFEFF/, '');
  if (!t.startsWith(TAG)) return { src: t, cfg: null };
  const nl = t.indexOf('\n');
  let cfg = null;
  try { cfg = JSON.parse(t.slice(TAG.length, nl < 0 ? undefined : nl)); } catch {}
  return { src: nl < 0 ? '' : t.slice(nl + 1), cfg };
}

async function exportCurrent() {
  const text = serializeProject();
  const fname = getFileName() + '.txt';
  const say = (m) => { $('#st-reason').textContent = m; };

  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: fname, data: text }); say('已下載 ' + fname); }
    catch (err) {
      const code = err && err.code;
      if (code === 'declined') say('已取消下載');
      else { await copyFallback(text, fname, say); }
    }
    return;
  }

  if (window.self !== window.top) return copyFallback(text, fname, say);

  const a = document.createElement('a');
  const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  say('已下載 ' + fname);
}
async function copyFallback(text, fname, say) {
  try { await navigator.clipboard.writeText(text); say('這個環境不能直接下載，已複製到剪貼簿，貼到記事本存成 ' + fname + ' 即可'); }
  catch { say('無法下載也無法複製，請直接從編輯器全選複製'); }
}
